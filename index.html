<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Zero-Trace</title>

<style>
* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
}

html,
body {
    width: 100%;
    min-height: 100%;
    background: #000;
}

body {
    min-height: 100vh;
    overflow: hidden;

    display: flex;
    align-items: center;
    justify-content: center;

    font-family: Arial, Helvetica, sans-serif;
    color: #fff;

    background:
        radial-gradient(
            circle at 50% 45%,
            #1c0d00 0%,
            #080400 38%,
            #000000 78%
        );
}

/* =========================
   ОРАНЖЕВОЕ СВЕЧЕНИЕ
========================= */

.bg-glow {
    position: fixed;

    width: 380px;
    height: 380px;

    left: 50%;
    top: 50%;

    transform: translate(-50%, -50%);

    background: #ff6500;

    filter: blur(180px);

    opacity: .08;

    pointer-events: none;
}

/* =========================
   КАРТОЧКА
========================= */

.card {
    position: relative;

    width: min(88%, 430px);

    padding: 36px 28px 30px;

    text-align: center;

    background:
        linear-gradient(
            145deg,
            rgba(25, 12, 3, .97),
            rgba(5, 3, 0, .98)
        );

    border: 1px solid rgba(255, 102, 0, .38);

    border-radius: 24px;

    box-shadow:
        0 25px 70px rgba(0,0,0,.85),
        0 0 40px rgba(255,80,0,.07);

    backdrop-filter: blur(18px);

    z-index: 2;
}

/* Верхняя оранжевая линия */

.card::before {
    content: "";

    position: absolute;

    top: 0;
    left: 15%;

    width: 70%;
    height: 1px;

    background:
        linear-gradient(
            90deg,
            transparent,
            #ff6500,
            transparent
        );

    box-shadow:
        0 0 10px #ff6500;
}

/* =========================
   ИКОНКА
========================= */

.icon {
    width: 64px;
    height: 64px;

    margin: 0 auto 20px;

    display: flex;
    align-items: center;
    justify-content: center;

    border-radius: 18px;

    background:
        linear-gradient(
            145deg,
            rgba(255,100,0,.15),
            rgba(50,20,0,.12)
        );

    border: 1px solid rgba(255,115,30,.5);

    font-size: 28px;

    box-shadow:
        0 0 25px rgba(255,90,0,.14);

    user-select: none;
}

/* =========================
   ЗАГОЛОВОК
========================= */

h1 {
    font-size: 30px;

    font-weight: 700;

    margin-bottom: 10px;

    letter-spacing: .3px;

    text-shadow:
        0 0 20px rgba(255,100,0,.25);
}

/* =========================
   ОПИСАНИЕ
========================= */

.description {
    color: #918b86;

    font-size: 14px;

    line-height: 1.5;

    margin-bottom: 27px;
}

/* =========================
   КНОПКА
========================= */

.bot-button {
    position: relative;

    display: block;

    width: 100%;
    height: 58px;

    padding: 0 18px;

    border: 1px solid #ff6500;

    border-radius: 15px;

    background:
        linear-gradient(
            135deg,
            rgba(190,65,0,.22),
            rgba(25,10,0,.95)
        );

    color: #fff;

    font-size: 16px;

    font-weight: 600;

    cursor: pointer;

    overflow: hidden;

    box-shadow:
        0 0 16px rgba(255,90,0,.22);

    transition:
        transform .25s ease,
        box-shadow .25s ease,
        border-color .25s ease;

    animation: pulse 3s ease-in-out infinite;

    -webkit-tap-highlight-color: transparent;
}

/* Блик */

.bot-button::before {
    content: "";

    position: absolute;

    top: 0;
    left: -120%;

    width: 65%;
    height: 100%;

    background:
        linear-gradient(
            90deg,
            transparent,
            rgba(255,255,255,.18),
            transparent
        );

    transform: skewX(-25deg);
}

.bot-button:hover::before {
    animation: shine .8s ease;
}

.bot-button:hover {
    transform: translateY(-2px);

    border-color: #ff913f;

    box-shadow:
        0 0 30px rgba(255,90,0,.48),
        0 10px 30px rgba(0,0,0,.35);
}

.bot-button:active {
    transform: scale(.98);
}

/* Пульсация */

@keyframes pulse {

    0%, 100% {
        box-shadow:
            0 0 14px rgba(255,90,0,.18);
    }

    50% {
        box-shadow:
            0 0 27px rgba(255,90,0,.42),
            0 0 45px rgba(255,90,0,.08);
    }
}

@keyframes shine {

    from {
        left: -120%;
    }

    to {
        left: 160%;
    }
}

/* =========================
   НИЖНИЙ ТЕКСТ
========================= */

.footer-text {
    margin-top: 17px;

    color: #514a45;

    font-size: 11px;
}

/* =========================
   ИНСТРУКЦИЯ
========================= */

.help {
    display: none;

    position: fixed;

    top: 10px;
    right: 10px;

    width: 225px;

    padding: 13px 15px;

    z-index: 999;

    background:
        rgba(10,6,2,.97);

    border: 1px solid rgba(255,105,0,.65);

    border-radius: 15px;

    box-shadow:
        0 0 22px rgba(255,80,0,.20);

    font-size: 12px;

    line-height: 1.45;
}

.help-title {
    font-size: 14px;

    font-weight: 700;

    margin-bottom: 4px;
}

.help-text {
    color: #a39b95;
}

.help-text b {
    color: #fff;
}

/* =========================
   СТРЕЛКА
========================= */

.arrow {
    position: absolute;

    top: -29px;
    right: 13px;

    width: 30px;
    height: 30px;

    pointer-events: none;
}

.arrow::before {
    content: "";

    position: absolute;

    width: 3px;
    height: 25px;

    right: 8px;
    top: 5px;

    border-radius: 5px;

    background: #ff6500;

    transform: rotate(42deg);

    box-shadow:
        0 0 7px rgba(255,100,0,.8);
}

.arrow::after {
    content: "";

    position: absolute;

    width: 10px;
    height: 10px;

    right: 1px;
    top: 0;

    border-top: 3px solid #ff6500;
    border-right: 3px solid #ff6500;

    transform: rotate(42deg);

    filter:
        drop-shadow(
            0 0 5px rgba(255,100,0,.8)
        );
}

/* =========================
   МОБИЛЬНАЯ ВЕРСИЯ
========================= */

@media (max-width: 700px) {

    .help {
        display: block;
    }

    .card {
        width: calc(100% - 30px);

        max-width: 400px;

        padding: 32px 22px 27px;

        border-radius: 22px;
    }

    .icon {
        width: 58px;
        height: 58px;

        margin-bottom: 17px;

        font-size: 25px;
    }

    h1 {
        font-size: 27px;
    }

    .description {
        font-size: 13px;

        margin-bottom: 23px;
    }

    .bot-button {
        height: 55px;

        font-size: 15px;
    }
}

/* Маленькие телефоны */

@media (max-width: 380px) {

    .help {
        width: 210px;

        font-size: 11px;
    }

    .help-title {
        font-size: 13px;
    }

    .card {
        padding: 28px 18px 24px;
    }

    h1 {
        font-size: 25px;
    }
}
</style>
</head>

<body>

<div class="bg-glow"></div>

<!-- Инструкция -->

<div class="help">

    <div class="arrow"></div>

    <div class="help-title">
        ⚠️ Не открывается?
    </div>

    <div class="help-text">
        Нажми на <b>•••</b> в правом верхнем углу
        и выбери <b>«Открыть в браузере»</b>.
    </div>

</div>

<!-- Основной блок -->

<div class="card">

    <div class="icon">
        ⚠️
    </div>

    <h1>
        Zero-Trace
    </h1>

    <div class="description">
        Нажми на кнопку ниже,<br>
        чтобы перейти в нашего бота
    </div>

    <button
        class="bot-button"
        onclick="openBot()"
    >
        🔸 Переход в нашего бота 🔸
    </button>

    <div class="footer-text">
        🔸 Быстрый переход через Telegram
    </div>

</div>

<script>

const BOT_LINK =
"https://t.me/ZeroTraceeBbot?start=ref_eyJhnre1ECbTo6ihrP6ne6g";

function openBot() {
    window.location.href = BOT_LINK;
}

/* Восстановление фона */

function restorePage() {

    document.documentElement.style.background = "#000";

    document.body.style.background =
        "radial-gradient(circle at 50% 45%, #1c0d00 0%, #080400 38%, #000000 78%)";

    document.body.style.opacity = "1";
}

window.addEventListener("pageshow", restorePage);

window.addEventListener("focus", restorePage);

document.addEventListener("visibilitychange", function () {

    if (!document.hidden) {
        restorePage();
    }

});

</script>

</body>
</html>
